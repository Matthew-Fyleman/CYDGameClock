; CYD Game Clock - ESP32-3248S035R (3.5" CYD)
; ST7796 320x480 + XPT2046 resistive touch on a shared SPI bus

[platformio]
name = CYDGameClock
description = Animated game clocks and PC stats monitor for the 3.5" CYD

[env:cyd35]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

; 1.9 MB app slots (OTA-capable) - the firmware is too big for the default 1.2 MB
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    adafruit/Adafruit GFX Library @ ^1.12.4
    bblanchon/ArduinoJson @ ^7.4.2
    ricmoo/QRCode @ ^0.0.1

build_flags =
    -D USER_SETUP_LOADED
    -D ST7796_DRIVER
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MOSI=13
    -D TFT_MISO=12
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_FONT2
    -D LOAD_FONT4
